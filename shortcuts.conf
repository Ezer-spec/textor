# Textor IDE - Keyboard Shortcuts
# Format: action_name=CTRL+SHIFT+KEY
# Edit this file or use Settings -> Keybindings to rebind.

save=Ctrl+S
close_tab=Ctrl+W
next_tab=Ctrl+Tab
prev_tab=Ctrl+Shift+Tab
select_all=Ctrl+A
copy=Ctrl+C
cut=Ctrl+X
paste=Ctrl+V
duplicate_line=Ctrl+D
toggle_console=Ctrl+`
settings=Ctrl+,
find=Ctrl+F
toggle_sidebar=Ctrl+B
new_file=Ctrl+N
open_file=Ctrl+O
quit=Ctrl+Q
indent=Tab
autocomplete=Space
scroll_to_cursor=Ctrl+L
focus_mode=F11
focus_sidebar=Ctrl+1
focus_editor=Ctrl+2
focus_tabs=Ctrl+3
focus_console=Ctrl+4
move_focus_next=Ctrl+Alt+Right
move_focus_prev=Ctrl+Alt+Left
